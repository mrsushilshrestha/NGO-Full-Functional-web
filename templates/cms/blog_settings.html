{% extends 'cms/base.html' %}
{% load crispy_forms_tags %}
{% block page_title %}Blog Settings{% endblock %}
{% block content %}
<div class="cms-card">
    <h5 class="mb-4">Blog Page Settings</h5>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'cms_blog' %}" class="btn btn-outline-secondary">Back to Blog</a>
        </div>
    </form>
</div>
{% endblock %}
